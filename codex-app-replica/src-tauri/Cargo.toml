[package]
name = "codex-app-replica"
version = "0.1.0"
edition = "2021"

[lib]
name = "codex_app_replica"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.3.5"
tokio = { version = "1.48.0", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }
